<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Parkour EVIG - Shops & Power-ups!</title>
    <style>
        * {
            user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #0a1620 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            background: #1a1a2e;
            border-radius: 28px;
            padding: 8px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 0 3px #ffd966, 0 10px 25px black;
            cursor: pointer;
        }

        .joy-area {
            position: fixed;
            bottom: 30px;
            left: 25px;
            width: 130px;
            height: 130px;
            border-radius: 999px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.6);
            touch-action: none;
            z-index: 20;
        }

        .joystick-base {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 999px;
            background: rgba(40,40,60,0.8);
        }

        .joystick-thumb {
            position: absolute;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, #ffcc44, #ff9900);
            border-radius: 999px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 12px black;
            pointer-events: none;
        }

        .jump-btn {
            position: fixed;
            bottom: 40px;
            right: 30px;
            width: 85px;
            height: 85px;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 35%, #ff6b6b, #cc3333);
            border: none;
            box-shadow: 0 8px 0 #8b0000;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #5a0000;
            cursor: pointer;
            touch-action: manipulation;
            z-index: 20;
            transition: 0.05s linear;
            font-family: monospace;
        }

        .jump-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #8b0000;
        }

        .dash-btn {
            position: fixed;
            bottom: 40px;
            right: 140px;
            width: 70px;
            height: 70px;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 35%, #4ecdc4, #2c7a7a);
            border: none;
            box-shadow: 0 6px 0 #1a5c5c;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
            z-index: 20;
            transition: 0.05s linear;
            font-family: monospace;
        }

        .dash-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1a5c5c;
        }

        .dash-btn.cooldown {
            opacity: 0.5;
            transform: none;
            pointer-events: none;
        }

        .scoreboard {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #000000bb;
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: bold;
            color: #ffd966;
            font-size: 1.5rem;
            font-family: monospace;
            letter-spacing: 1px;
            border: 1px solid #ffd966;
            z-index: 15;
            display: flex;
            gap: 20px;
        }

        .coin-counter {
            color: #ffcc44;
        }

        .restart-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #2c3e66;
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 #0f1a2e;
            z-index: 20;
            font-family: inherit;
            touch-action: manipulation;
        }

        .warning-message {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4444dd;
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 15;
            white-space: nowrap;
            pointer-events: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
            100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
        }

        .powerup-status {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #9b59b6dd;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 15;
            white-space: nowrap;
            pointer-events: none;
        }

        .shop-overlay {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000cc;
            backdrop-filter: blur(15px);
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            z-index: 25;
            border: 2px solid #9b59b6;
            pointer-events: auto;
        }

        .shop-item {
            background: #2c3e66;
            padding: 8px 12px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            color: white;
            font-weight: bold;
        }

        .shop-item:active {
            transform: scale(0.95);
        }

        @media (max-width: 700px) {
            .joy-area { width: 110px; height: 110px; bottom: 25px; left: 15px; }
            .joystick-thumb { width: 45px; height: 45px; }
            .jump-btn { width: 70px; height: 70px; bottom: 30px; right: 20px; font-size: 1.6rem; }
            .dash-btn { width: 60px; height: 60px; bottom: 35px; right: 105px; font-size: 1.2rem; }
            .scoreboard { font-size: 1.2rem; padding: 6px 15px; gap: 12px; }
            .warning-message { font-size: 0.7rem; top: 80px; }
            .powerup-status { top: 80px; font-size: 0.7rem; }
            .shop-overlay { bottom: 160px; padding: 8px 12px; gap: 8px; }
            .shop-item { padding: 5px 8px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="500" height="700"></canvas>
</div>
<div class="scoreboard">
    <span>🏆 <span id="scoreValue">0</span></span>
    <span class="coin-counter">🪙 <span id="coinValue">0</span></span>
</div>
<button class="restart-btn" id="resetGameBtn">🔄 Restart</button>
<button class="jump-btn" id="jumpButton">⬆️ HOPP</button>
<button class="dash-btn" id="dashButton">⚡ DASH</button>
<div id="warningMessage" class="warning-message" style="display: none;">⚠️ BAKKEN FORSVINNER VED 60 POENG! ⚠️</div>
<div id="powerupStatus" class="powerup-status" style="display: none;"></div>
<div id="shopOverlay" class="shop-overlay" style="display: none;">
    <div class="shop-item" data-item="fly">🕊️ FLY 5s<br>💰320</div>
    <div class="shop-item" data-item="slowfall">🍃 SLOW FALL<br>💰130</div>
    <div class="shop-item" data-item="launch">🚀 LAUNCH<br>💰270</div>
</div>

<div id="joyArea" class="joy-area">
    <div class="joystick-base"></div>
    <div id="joyThumb" class="joystick-thumb"></div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const warningMsg = document.getElementById('warningMessage');
        const shopOverlay = document.getElementById('shopOverlay');

        // Spill status
        let gameRunning = true;
        let score = 0;
        let coins = 0;
        let cameraX = 0;
        let groundRemoved = false;
        let nearShop = false;
        let currentShopPos = null;
        
        // Power-ups
        let activePowerup = null;
        let powerupTimer = 0;
        let isFlying = false;
        let isSlowFalling = false;
        let currentGravity = 0.7;
        
        // Dash
        let dashCooldown = 0;
        let canDash = true;
        const DASH_COOLDOWN_MAX = 120;
        const DASH_FORCE = 22;
        let isDashing = false;
        let dashParticles = [];
        
        // Launch
        let isLaunching = false;
        let launchTimer = 0;
        
        // Fiender, kuler, mynter, bygninger, shops
        let enemies = [];
        let bullets = [];
        let coinsList = [];
        let buildings = [];
        let shops = [];
        let lastEnemySpawnX = 0;
        
        // Spiller
        const PLAYER_WIDTH = 28;
        const PLAYER_HEIGHT = 32;
        let player = {
            x: 150,
            y: 0,
            vx: 0,
            vy: 0,
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            grounded: false
        };
        
        const GRAVITY = 0.7;
        const JUMP_POWER = -11;
        
        // Evig generering
        let lastGeneratedX = 500;
        
        // ----- TILFELDIG GENERASJON (evig) med FLERE coins! -----
        function generateMoreWorld() {
            let lastX = lastGeneratedX;
            for(let i = 0; i < 5; i++) {
                let spacing = 100 + Math.random() * 140;
                let x = lastX + spacing;
                let width = 65 + Math.random() * 75;
                let y = 470 + Math.random() * 140;
                y = Math.min(y, 590);
                
                buildings.push({
                    x: x,
                    y: y,
                    width: width,
                    height: 12,
                    type: 'roof',
                    color: `hsl(${30 + Math.random() * 40}, 55%, 48%)`
                });
                
                buildings.push({
                    x: x + 5,
                    y: y + 12,
                    width: width - 10,
                    height: 620 - y - 12,
                    type: 'buildingBody',
                    color: '#3a2a2a'
                });
                
                // FLERE MYNTER! (60% sjanse i stedet for 55%)
                if(Math.random() > 0.4) {
                    coinsList.push({
                        x: x + width/2 - 8,
                        y: y - 18,
                        width: 16,
                        height: 16,
                        collected: false
                    });
                }
                
                // Ekstra mynt i luften over taket
                if(Math.random() > 0.65) {
                    coinsList.push({
                        x: x + width/2 - 6,
                        y: y - 38,
                        width: 12,
                        height: 12,
                        collected: false
                    });
                }
                
                // Shop (8% sjanse)
                if(Math.random() < 0.08 && shops.length < 4) {
                    shops.push({
                        x: x + width/2 - 15,
                        y: y - 45,
                        width: 30,
                        height: 40,
                        purchased: false,
                        type: 'shop'
                    });
                }
                
                lastX = x + width;
            }
            lastGeneratedX = lastX;
        }
        
        function generateStartWorld() {
            buildings = [];
            coinsList = [];
            enemies = [];
            shops = [];
            
            buildings.push({ x: -200, y: 620, width: 5000, height: 20, type: 'ground', id: 'ground' });
            
            let lastX = 80;
            for(let i = 0; i < 15; i++) {
                let spacing = 90 + Math.random() * 130;
                let x = lastX + spacing;
                let width = 65 + Math.random() * 75;
                let y = 470 + Math.random() * 140;
                y = Math.min(y, 590);
                
                buildings.push({ x: x, y: y, width: width, height: 12, type: 'roof', color: `hsl(${30 + Math.random() * 40}, 55%, 48%)` });
                buildings.push({ x: x + 5, y: y + 12, width: width - 10, height: 620 - y - 12, type: 'buildingBody', color: '#3a2a2a' });
                
                // FLERE MYNTER! (60% sjanse)
                if(Math.random() > 0.4) {
                    coinsList.push({ x: x + width/2 - 8, y: y - 18, width: 16, height: 16, collected: false });
                }
                
                // Ekstra mynt over taket
                if(Math.random() > 0.65) {
                    coinsList.push({ x: x + width/2 - 6, y: y - 38, width: 12, height: 12, collected: false });
                }
                
                if(Math.random() < 0.08 && shops.length < 2) {
                    shops.push({ x: x + width/2 - 15, y: y - 45, width: 30, height: 40, purchased: false, type: 'shop' });
                }
                
                lastX = x + width;
            }
            
            // Ekstra flytende mynter i luften (flere!)
            for(let i = 0; i < 35; i++) {
                coinsList.push({
                    x: 150 + Math.random() * 4000,
                    y: 420 + Math.random() * 180,
                    width: 12,
                    height: 12,
                    collected: false
                });
            }
            
            lastGeneratedX = lastX;
        }
        
        // Skyte-fiender (ved 300+ poeng)
        function spawnShootingEnemy() {
            if(score >= 300 && enemies.length < 5 && Math.random() < 0.008) {
                let spawnX = player.x + 400 + Math.random() * 300;
                let targetY = 550;
                for(let b of buildings) {
                    if(b.type === 'roof' && Math.abs(b.x - spawnX) < 100) {
                        targetY = b.y - 28;
                        break;
                    }
                }
                enemies.push({
                    x: spawnX,
                    y: targetY,
                    width: 30,
                    height: 30,
                    type: 'shooter',
                    shootTimer: 0
                });
            }
        }
        
        function handleShooters() {
            for(let e of enemies) {
                if(e.type === 'shooter') {
                    e.shootTimer = (e.shootTimer || 0) + 1;
                    if(e.shootTimer > 60) {
                        e.shootTimer = 0;
                        let dx = player.x - e.x;
                        let dy = player.y - e.y;
                        let len = Math.hypot(dx, dy);
                        if(len < 500) {
                            bullets.push({
                                x: e.x + 15,
                                y: e.y + 15,
                                vx: (dx / len) * 5,
                                vy: (dy / len) * 5,
                                radius: 5
                            });
                        }
                    }
                }
            }
        }
        
        // Power-ups
        function activatePowerup(type) {
            if(type === 'fly') {
                isFlying = true;
                activePowerup = '🕊️ FLYVING';
                powerupTimer = 300;
                player.vy = -5;
            } else if(type === 'slowfall') {
                isSlowFalling = true;
                activePowerup = '🍃 SLOW FALL';
                powerupTimer = 2100;
                currentGravity = 0.25;
            } else if(type === 'launch') {
                isLaunching = true;
                activePowerup = '🚀 LAUNCH';
                launchTimer = 20;
                let launchDir = (Math.abs(joyX) > 0.2) ? Math.sign(joyX) : 1;
                player.vx = launchDir * 18;
                player.vy = -14;
            }
            document.getElementById('powerupStatus').style.display = 'block';
            document.getElementById('powerupStatus').innerHTML = activePowerup;
        }
        
        function updatePowerups() {
            if(powerupTimer > 0) {
                powerupTimer--;
                if(powerupTimer <= 0) {
                    if(isFlying) isFlying = false;
                    if(isSlowFalling) {
                        isSlowFalling = false;
                        currentGravity = 0.7;
                    }
                    activePowerup = null;
                    document.getElementById('powerupStatus').style.display = 'none';
                } else {
                    let seconds = (powerupTimer / 60).toFixed(1);
                    document.getElementById('powerupStatus').innerHTML = `${activePowerup} ⏱️ ${seconds}s`;
                }
            }
            
            if(isLaunching) {
                if(launchTimer > 0) {
                    launchTimer--;
                    player.vx *= 0.96;
                    player.vy += 0.3;
                    if(launchTimer <= 0) {
                        isLaunching = false;
                    }
                }
            }
            
            if(isFlying) {
                player.vy *= 0.98;
                if(player.vy < -3) player.vy = -3;
                player.grounded = false;
            }
        }
        
        // Sjekk om player er nær shop
        function checkNearShop() {
            let wasNear = nearShop;
            nearShop = false;
            for(let s of shops) {
                if(Math.abs(player.x - s.x) < 80 && Math.abs(player.y - s.y) < 60) {
                    nearShop = true;
                    currentShopPos = s;
                    break;
                }
            }
            
            if(nearShop && !wasNear) {
                shopOverlay.style.display = 'flex';
            } else if(!nearShop && wasNear) {
                shopOverlay.style.display = 'none';
            }
        }
        
        // Fjern bakken ved 60 poeng (warning ved 50)
        function checkGroundRemoval() {
            if(!groundRemoved && score >= 60) {
                groundRemoved = true;
                buildings = buildings.filter(b => b.id !== 'ground');
                warningMsg.style.display = 'none';
                const msg = document.createElement('div');
                msg.textContent = '💀 BAKKEN ER BORTE! BRUK BYGNINGENE! 💀';
                msg.style.position = 'fixed';
                msg.style.top = '50%';
                msg.style.left = '50%';
                msg.style.transform = 'translate(-50%, -50%)';
                msg.style.backgroundColor = '#ff0000dd';
                msg.style.color = 'white';
                msg.style.padding = '20px';
                msg.style.borderRadius = '20px';
                msg.style.fontWeight = 'bold';
                msg.style.fontSize = '1.3rem';
                msg.style.zIndex = '100';
                msg.style.textAlign = 'center';
                msg.style.backdropFilter = 'blur(8px)';
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 2000);
                if(navigator.vibrate) navigator.vibrate(200);
            } else if(!groundRemoved && score >= 50) {
                warningMsg.style.display = 'block';
            } else if(!groundRemoved && score < 50) {
                warningMsg.style.display = 'none';
            }
        }
        
        // ----- JOYSTICK -----
        const joyArea = document.getElementById('joyArea');
        const joyThumb = document.getElementById('joyThumb');
        let activeTouchId = null;
        let joyX = 0, joyY = 0;
        const joyRadius = 45;
        let joyCenter = { x: 65, y: 65 };
        
        function updateJoyCenter() {
            const rect = joyArea.getBoundingClientRect();
            joyCenter.x = rect.width / 2;
            joyCenter.y = rect.height / 2;
        }
        updateJoyCenter();
        window.addEventListener('resize', () => updateJoyCenter());
        
        function setThumbPos(deltaX, deltaY) {
            let dist = Math.hypot(deltaX, deltaY);
            let limX = deltaX, limY = deltaY;
            if(dist > joyRadius) {
                limX = (deltaX / dist) * joyRadius;
                limY = (deltaY / dist) * joyRadius;
            }
            joyThumb.style.transform = `translate(calc(-50% + ${limX}px), calc(-50% + ${limY}px))`;
            joyX = limX / joyRadius;
            joyY = limY / joyRadius;
        }
        
        function resetJoystick() {
            joyX = 0;
            joyY = 0;
            joyThumb.style.transform = `translate(-50%, -50%)`;
            activeTouchId = null;
        }
        
        joyArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(activeTouchId !== null) return;
            const touch = e.touches[0];
            activeTouchId = touch.identifier;
            const rect = joyArea.getBoundingClientRect();
            const tx = touch.clientX - rect.left;
            const ty = touch.clientY - rect.top;
            setThumbPos(tx - joyCenter.x, ty - joyCenter.y);
        });
        
        joyArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(activeTouchId === null) return;
            let found = null;
            for(let t of e.touches) if(t.identifier === activeTouchId) { found = t; break; }
            if(found) {
                const rect = joyArea.getBoundingClientRect();
                const tx = found.clientX - rect.left;
                const ty = found.clientY - rect.top;
                setThumbPos(tx - joyCenter.x, ty - joyCenter.y);
            }
        });
        
        joyArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            let still = false;
            for(let t of e.touches) if(t.identifier === activeTouchId) still = true;
            if(!still) resetJoystick();
        });
        joyArea.addEventListener('touchcancel', () => resetJoystick());
        
        // ----- KNAPPER -----
        const jumpButton = document.getElementById('jumpButton');
        const dashButton = document.getElementById('dashButton');
        
        function performJump() {
            if(!gameRunning) return;
            if((player.grounded || isFlying) && !isLaunching) {
                player.vy = JUMP_POWER;
                player.grounded = false;
                if(navigator.vibrate) navigator.vibrate(40);
            }
        }
        
        function performDash() {
            if(!gameRunning) return;
            if(dashCooldown <= 0 && canDash && !isLaunching) {
                let dashPowerX = DASH_FORCE;
                let dashPowerY = 0;
                if(Math.abs(joyX) > 0.2 || Math.abs(joyY) > 0.2) {
                    let len = Math.hypot(joyX, joyY);
                    dashPowerX = (joyX / len) * DASH_FORCE;
                    dashPowerY = (joyY / len) * DASH_FORCE;
                }
                player.vx = dashPowerX;
                player.vy = dashPowerY * 0.9;
                isDashing = true;
                for(let i = 0; i < 12; i++) {
                    dashParticles.push({
                        x: player.x,
                        y: player.y + PLAYER_HEIGHT/2,
                        vx: -dashPowerX * 0.5 + (Math.random() - 0.5) * 3,
                        vy: -dashPowerY * 0.5 + (Math.random() - 0.5) * 3,
                        life: 0.6
                    });
                }
                dashCooldown = DASH_COOLDOWN_MAX;
                canDash = false;
                if(navigator.vibrate) navigator.vibrate(60);
                dashButton.classList.add('cooldown');
                setTimeout(() => {
                    if(dashCooldown <= 0) dashButton.classList.remove('cooldown');
                }, 100);
            }
        }
        
        jumpButton.addEventListener('click', (e) => { e.preventDefault(); performJump(); });
        jumpButton.addEventListener('touchstart', (e) => { e.preventDefault(); performJump(); });
        dashButton.addEventListener('click', (e) => { e.preventDefault(); performDash(); });
        dashButton.addEventListener('touchstart', (e) => { e.preventDefault(); performDash(); });
        
        // Shop kjøp
        document.querySelectorAll('.shop-item').forEach(item => {
            item.addEventListener('click', () => {
                if(!gameRunning) return;
                if(!nearShop) return;
                let type = item.dataset.item;
                let cost = 0;
                if(type === 'fly') cost = 320;
                else if(type === 'slowfall') cost = 130;
                else if(type === 'launch') cost = 270;
                
                if(coins >= cost && !activePowerup) {
                    coins -= cost;
                    activatePowerup(type);
                    document.getElementById('coinValue').innerText = coins;
                    shopOverlay.style.display = 'none';
                    nearShop = false;
                }
            });
            item.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if(!gameRunning) return;
                if(!nearShop) return;
                let type = item.dataset.item;
                let cost = 0;
                if(type === 'fly') cost = 320;
                else if(type === 'slowfall') cost = 130;
                else if(type === 'launch') cost = 270;
                
                if(coins >= cost && !activePowerup) {
                    coins -= cost;
                    activatePowerup(type);
                    document.getElementById('coinValue').innerText = coins;
                    shopOverlay.style.display = 'none';
                    nearShop = false;
                }
            });
        });
        
        // ----- KOLLISJONER -----
        function handleCollisions() {
            if(dashCooldown > 0) {
                dashCooldown--;
                if(dashCooldown <= 0) {
                    canDash = true;
                    dashButton.classList.remove('cooldown');
                    isDashing = false;
                }
            }
            
            if(!isDashing || dashCooldown < DASH_COOLDOWN_MAX - 15) {
                let move = joyX * 5.5;
                if(!isLaunching) player.vx = move;
            }
            
            player.x += player.vx;
            if(player.x < 50) player.x = 50;
            
            player.vy += currentGravity;
            player.y += player.vy;
            player.grounded = false;
            
            for(let b of buildings) {
                if(b.type === 'buildingBody') continue;
                if(player.x + player.width > b.x && player.x < b.x + b.width) {
                    let playerBottom = player.y + player.height;
                    if(player.vy >= 0 && playerBottom <= b.y + 25 && playerBottom + player.vy >= b.y) {
                        player.y = b.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                        if(isFlying) isFlying = false;
                    }
                    else if(player.vy < 0 && player.y >= b.y + b.height) {
                        player.y = b.y + b.height;
                        player.vy = 0;
                    }
                }
            }
            
            if(player.y > 700) gameRunning = false;
            if(player.y < -50) player.y = -30;
            
            // Mynter
            for(let coin of coinsList) {
                if(!coin.collected && 
                   player.x < coin.x + coin.width && 
                   player.x + player.width > coin.x &&
                   player.y < coin.y + coin.height && 
                   player.y + player.height > coin.y) {
                    coin.collected = true;
                    coins++;
                    if(navigator.vibrate) navigator.vibrate(20);
                    document.getElementById('coinValue').innerText = coins;
                }
            }
            
            // Fiender
            for(let i = 0; i < enemies.length; i++) {
                let e = enemies[i];
                if(player.x < e.x + e.width && player.x + player.width > e.x &&
                   player.y < e.y + e.height && player.y + player.height > e.y) {
                    if(player.vy > 0 && player.y + player.height - e.y < 18) {
                        enemies.splice(i,1);
                        player.vy = -9;
                        score += 15;
                        if(navigator.vibrate) navigator.vibrate(50);
                        i--;
                    } else if(!isFlying) {
                        gameRunning = false;
                    }
                }
            }
            
            // Kuler
            for(let i = 0; i < bullets.length; i++) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if(b.x < 0 || b.x > 5000 || b.y < 0 || b.y > 800) {
                    bullets.splice(i,1);
                    i--;
                    continue;
                }
                if(player.x < b.x + b.radius && player.x + player.width > b.x - b.radius &&
                   player.y < b.y + b.radius && player.y + player.height > b.y - b.radius) {
                    if(!isFlying) gameRunning = false;
                    bullets.splice(i,1);
                    break;
                }
            }
            
            // Partikler
            for(let i = 0; i < dashParticles.length; i++) {
                dashParticles[i].x += dashParticles[i].vx;
                dashParticles[i].y += dashParticles[i].vy;
                dashParticles[i].life -= 0.03;
                if(dashParticles[i].life <= 0) {
                    dashParticles.splice(i,1);
                    i--;
                }
            }
            
            let targetCam = player.x - canvas.width/2 + player.width/2;
            targetCam = Math.min(Math.max(targetCam, 0), lastGeneratedX + 500);
            cameraX = targetCam;
            
            // Evig generering
            if(player.x > lastGeneratedX - 800) {
                generateMoreWorld();
            }
            
            // Sjekk shop
            checkNearShop();
        }
        
        function updateGame() {
            if(gameRunning) {
                let distanceProgress = (player.x - 100) / 28;
                score = Math.max(score, Math.floor(distanceProgress) + coins);
                document.getElementById('scoreValue').innerText = Math.floor(score);
                document.getElementById('coinValue').innerText = coins;
                
                checkGroundRemoval();
                spawnShootingEnemy();
                handleShooters();
                updatePowerups();
                handleCollisions();
            }
        }
        
        function restartGame() {
            gameRunning = true;
            score = 0;
            coins = 0;
            groundRemoved = false;
            player.x = 150;
            player.y = 500;
            player.vx = 0;
            player.vy = 0;
            player.grounded = true;
            dashCooldown = 0;
            canDash = true;
            isDashing = false;
            isFlying = false;
            isSlowFalling = false;
            isLaunching = false;
            currentGravity = 0.7;
            activePowerup = null;
            powerupTimer = 0;
            cameraX = 0;
            enemies = [];
            bullets = [];
            dashParticles = [];
            nearShop = false;
            shopOverlay.style.display = 'none';
            
            generateStartWorld();
            
            dashButton.classList.remove('cooldown');
            document.getElementById('powerupStatus').style.display = 'none';
            document.getElementById('coinValue').innerText = coins;
            warningMsg.style.display = 'none';
        }
        
        document.getElementById('resetGameBtn').addEventListener('click', () => restartGame());
        document.getElementById('resetGameBtn').addEventListener('touchstart', (e) => { e.preventDefault(); restartGame(); });
        
        // ----- TEGNING -----
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0f172f');
            gradient.addColorStop(1, '#1a2a4a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for(let b of buildings) {
                let screenX = b.x - cameraX;
                if(screenX + b.width < 0 || screenX > canvas.width) continue;
                
                if(b.type === 'roof') {
                    ctx.fillStyle = b.color || '#b87c4f';
                    ctx.fillRect(screenX, b.y, b.width, b.height);
                    ctx.fillStyle = '#e5c28e';
                    ctx.fillRect(screenX+5, b.y-6, b.width-10, 8);
                    ctx.fillStyle = '#c9a87b';
                    ctx.fillRect(screenX, b.y-3, b.width, 4);
                } else if(b.type === 'buildingBody') {
                    ctx.fillStyle = b.color || '#4f3b2c';
                    ctx.fillRect(screenX, b.y, b.width, b.height);
                    ctx.fillStyle = '#ffd966aa';
                    for(let w=0; w<3; w++) {
                        ctx.fillRect(screenX+8+w*15, b.y+15, 8, 12);
                    }
                } else if(b.type === 'ground' && !groundRemoved) {
                    ctx.fillStyle = '#5d6d53';
                    ctx.fillRect(screenX, b.y, b.width, b.height);
                    ctx.fillStyle = '#4a5c3a';
                    for(let i=0; i<10; i++) {
                        ctx.fillRect(screenX + i*40, b.y-5, 15, 5);
                    }
                }
            }
            
            // Shops (lilla søyler)
            for(let s of shops) {
                let screenX = s.x - cameraX;
                ctx.fillStyle = '#9b59b6';
                ctx.fillRect(screenX, s.y, s.width, s.height);
                ctx.fillStyle = '#ffd700';
                ctx.font = '20px monospace';
                ctx.fillText('🏪', screenX+8, s.y+28);
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#9b59b6';
                ctx.fillStyle = '#ddaaff';
                ctx.fillRect(screenX+2, s.y-3, 26, 5);
                ctx.shadowBlur = 0;
            }
            
            for(let coin of coinsList) {
                if(!coin.collected) {
                    let screenX = coin.x - cameraX;
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(screenX+8, coin.y+8, 8, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#FFA500';
                    ctx.beginPath();
                    ctx.arc(screenX+8, coin.y+8, 4, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(screenX+5, coin.y+6, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            
            for(let e of enemies) {
                let screenX = e.x - cameraX;
                if(e.type === 'shooter') {
                    ctx.fillStyle = '#8B008B';
                    ctx.fillRect(screenX, e.y, e.width, e.height);
                    ctx.fillStyle = '#FF44FF';
                    ctx.fillRect(screenX+4, e.y-8, 22, 10);
                } else {
                    ctx.fillStyle = '#8B0000';
                    ctx.fillRect(screenX, e.y, e.width, e.height);
                    ctx.fillStyle = '#FF4444';
                    ctx.fillRect(screenX+4, e.y-8, 22, 10);
                }
                ctx.fillStyle = 'white';
                ctx.fillRect(screenX+7, e.y+6, 6, 6);
                ctx.fillRect(screenX+17, e.y+6, 6, 6);
                ctx.fillStyle = '#222';
                ctx.fillRect(screenX+11, e.y+16, 8, 5);
            }
            
            for(let b of bullets) {
                let screenX = b.x - cameraX;
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(screenX, b.y, b.radius, 0, Math.PI*2);
                ctx.fill();
            }
            
            for(let p of dashParticles) {
                let screenX = p.x - cameraX;
                ctx.fillStyle = `rgba(78, 205, 196, ${p.life})`;
                ctx.beginPath();
                ctx.arc(screenX, p.y, 4, 0, Math.PI*2);
                ctx.fill();
            }
            
            let playerScreenX = player.x - cameraX;
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#FF6B35';
            ctx.fillRect(playerScreenX, player.y, PLAYER_WIDTH, PLAYER_HEIGHT);
            ctx.fillStyle = '#E67E22';
            ctx.fillRect(playerScreenX+4, player.y-8, 20, 10);
            ctx.fillStyle = 'white';
            ctx.fillRect(playerScreenX+18, player.y+8, 7, 7);
            ctx.fillStyle = '#2c3e2f';
            ctx.fillRect(playerScreenX+6, player.y+22, 16, 8);
            
            if(isFlying) {
                ctx.fillStyle = '#9b59b6aa';
                ctx.fillRect(playerScreenX-5, player.y+10, 38, 12);
            }
            
            // Dash streak
            if(isDashing && dashCooldown > DASH_COOLDOWN_MAX - 8) {
                ctx.strokeStyle = '#4ecdc4';
                ctx.lineWidth = 5;
                let dirX = Math.sign(player.vx) || 1;
                let dirY = Math.sign(player.vy) || 0;
                if(dirX === 0 && dirY === 0) dirX = 1;
                
                for(let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    let offset = i * 10;
                    ctx.moveTo(playerScreenX - dirX * (10 + offset), player.y + 15 - dirY * (10 + offset));
                    ctx.lineTo(playerScreenX - dirX * (30 + offset), player.y + 15 - dirY * (30 + offset));
                    ctx.stroke();
                }
            }
            
            ctx.shadowBlur = 0;
            
            if(groundRemoved) {
                ctx.fillStyle = '#ff0000aa';
                ctx.font = 'bold 14px monospace';
                ctx.fillText('⚠️ INGEN BAKKE! ⚠️', canvas.width-160, 45);
            }
            
            if(!gameRunning) {
                ctx.font = 'bold 32px "Segoe UI"';
                ctx.fillStyle = '#ffcc88';
                ctx.shadowBlur = 4;
                ctx.fillText('💀 GAME OVER 💀', canvas.width/2-140, canvas.height/2-50);
                ctx.font = '18px monospace';
                ctx.fillStyle = '#ffdd99';
                ctx.fillText('Trykk RESTART', canvas.width/2-65, canvas.height/2+30);
            }
            
            if(dashCooldown > 0) {
                ctx.fillStyle = '#4ecdc4aa';
                ctx.font = 'bold 12px monospace';
                let secLeft = (dashCooldown / 60).toFixed(1);
                ctx.fillText(`⚡ ${secLeft}s`, canvas.width-55, 70);
            }
        }
        
        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        restartGame();
        gameLoop();
    })();
</script>
